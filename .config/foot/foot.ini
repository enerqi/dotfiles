# foot is the throwaway-terminal here: btop from the palette, nmtui from the
# Wi-Fi picker, the VPN terminals. wezterm is the everyday one.
#
# Without this, foot uses `monospace:size=8`, which is unreadably small on a
# 1920x1200 panel and worse on the 4K. Matching the swaybar font keeps the
# desktop looking like one thing.

font=CaskaydiaCove Nerd Font Mono:size=12
# Slightly larger for the 4K; foot picks per-output DPI when this is on.
dpi-aware=yes

pad=8x8

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
# Matches the sway config's own palette rather than foot's defaults.
background=1a1a1a
foreground=cccccc
