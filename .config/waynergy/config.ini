; waynergy - keyboard/mouse sharing client for wlroots/sway.
; Replaces the deskflow client, which cannot inject input under sway
; (no org.freedesktop.portal.RemoteDesktop on wlroots).
; Server is the Deskflow server on the Windows desktop; it speaks the
; Barrier 1.8 protocol, which waynergy understands.

host = 192.168.0.5
port = 24800
; must match the screen name configured on the Deskflow server
name = gigabox
backend = wlr

; Windows primary: keys arrive as PS/2 set-1 scancodes. ~/.config/waynergy/xkb_keymap
; maps them via the "win" keycodes section; this offset is required with it.
xkb_key_offset = 7

[tls]
; Deskflow requires TLS *and* a client certificate. tls/cert is symlinked
; to the deskflow client cert at ~/.config/Deskflow/tls/deskflow.pem;
; without it the server accepts the TLS handshake then sends nothing.
enable = true
tofu = true

[log]
level = info
