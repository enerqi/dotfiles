# fuzzel: the launcher ($mod+d) and the engine behind every ~/bin/fuzzel-*
# menu. Those scripts pass their own --width/--lines/--prompt, which override
# what is set here; this file covers the launcher itself and the defaults.

font=CaskaydiaCove Nerd Font Mono:size=12
dpi-aware=yes

# Desktop entries with `Terminal=true` (btop++, Vim, Python, TeXInfo) are
# launched inside this. fuzzel's built-in default is "xterm -e", and xterm is
# not installed here - so without this line those entries silently do nothing.
terminal=foot -e

lines=14
width=40
horizontal-pad=16
vertical-pad=10
inner-pad=6

[colors]
# Same palette as the sway config: #0088cc selection, #d7ff00 match highlight.
background=1a1a1aee
text=ccccccff
match=d7ff00ff
selection=0088ccff
selection-text=ffffffff
selection-match=d7ff00ff
border=0088ccff

[border]
width=2
radius=4

# Up/Down wrap around: pressing Up on the first entry jumps to the last, and
# Down on the last returns to the first. Applies to every fuzzel menu - the
# app launcher, the command palette and all the fuzzel-* pickers.
#
# fuzzel already has wrapping actions, just bound to Tab/Shift+Tab rather than
# the arrows. The defaults must be unbound first with `=none`: a key bound to
# two actions is a config error, and Up/Down belong to the non-wrapping
# `prev`/`next` out of the box.
#
# Control+p / Control+n are carried over so the readline-style navigation keeps
# working. Tab is deliberately NOT bound here: in fuzzel 1.12 it is
# `execute-or-next`, not `next-with-wrap` as the man page implies, and taking
# it would break dmenu-style completion. `fuzzel --check-config` catches that.
[key-bindings]
prev=none
next=none
prev-with-wrap=Up Control+p ISO_Left_Tab
next-with-wrap=Down Control+n
